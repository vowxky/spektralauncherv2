name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - platform: macos-latest
            target: aarch64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app (release)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Spektra ${{ github.ref_name }}"
          releaseBody: "See the assets below for download."
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

      # Solo Windows genera el artefacto que lee el updater (nsis). Subirlo al CDN público.
      # Repo privado -> el updater NO puede leer GitHub releases sin token, por eso se mantiene el CDN como fuente.
      - name: Prepare updater for CDN (Windows only, on tag)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'windows-latest'
        run: node scripts/release.js
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload to CDN (Windows, on tag)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'windows-latest'
        env:
          CDN_HOST: ${{ secrets.CDN_SSH_HOST }}
          CDN_USER: ${{ secrets.CDN_SSH_USER }}
          CDN_KEY: ${{ secrets.CDN_SSH_KEY }}
          CDN_PATH: ${{ secrets.CDN_PATH }}
        run: |
          # Resolver bundle dir con --target
          BUNDLE_DIR="target/release/bundle/nsis"
          if [ ! -d "$BUNDLE_DIR" ]; then BUNDLE_DIR="target/x86_64-pc-windows-msvc/release/bundle/nsis"; fi
          if [ -z "$CDN_HOST" ]; then
            echo "CDN secrets no configurados — se deja el artefacto en GitHub Release (draft) y en Actions artifacts."
            echo "Para auto-deploy al CDN, añade en GitHub Secrets: CDN_SSH_HOST, CDN_SSH_USER, CDN_SSH_KEY, CDN_PATH"
            ls -lh "$BUNDLE_DIR"/ || true
            ls -lh target/*/release/bundle/nsis/ 2>/dev/null || true
            exit 0
          fi
          echo "$CDN_KEY" > /tmp/cdn_key
          chmod 600 /tmp/cdn_key
          scp -i /tmp/cdn_key -o StrictHostKeyChecking=no "$BUNDLE_DIR/spektra-setup.exe" "$BUNDLE_DIR/update.json" "$CDN_USER@$CDN_HOST:$CDN_PATH/"
          echo "CDN updated from $BUNDLE_DIR"

      - name: Disable updater for dev builds (no signing key)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: node -e "const fs=require('fs');const p='src-tauri/tauri.conf.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.bundle.createUpdaterArtifacts=false;delete j.plugins.updater.pubkey;fs.writeFileSync(p,JSON.stringify(j,null,2));console.log('patched tauri.conf for dev')"

      - name: Build Tauri app (dev)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target ${{ matrix.target }}
